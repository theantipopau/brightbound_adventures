name: brightbound_adventures
description: 'A fully offline, child-safe, avatar-driven educational adventure app for children aged 4–12. Features Australian NAPLAN-aligned content, mini-games, responsive design, and engaging gamification.'
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.0.0
  equatable: ^2.0.5
  intl: ^0.20.2
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  confetti: ^0.8.0
  flutter_tts: ^4.2.3
  audioplayers: ^6.5.1
  lottie: ^3.6.0 # A6: level-up and badge-unlock Lottie overlays
  device_info_plus: ^12.3.0
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.0
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  nested: ^1.0.0 # test-only: typed provider rigs (screen_coverage_overflow_test)
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/images/zones/
    - assets/images/zones/word-woods/
    - assets/images/zones/number-nebula/
    - assets/images/zones/math-facts/
    - assets/images/zones/story-springs/
    - assets/images/zones/science-explorers/
    - assets/images/zones/creative-corner/
    - assets/images/zones/puzzle-peaks/
    - assets/images/zones/adventure-arena/
    - assets/images/zones/effects/
    - assets/sounds/
    - assets/sounds/sfx/
    - assets/sounds/sfx/correct/
    - assets/sounds/sfx/incorrect/
    - assets/sounds/sfx/celebration/
    - assets/sounds/sfx/ui/
    - assets/sounds/music/
    - assets/sounds/music/zones/
    - assets/fonts/
    - lib/core/data/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Regular.ttf
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600

    - family: Comfortaa
      fonts:
        - asset: assets/fonts/Comfortaa-Regular.ttf
        - asset: assets/fonts/Comfortaa-Bold.ttf
          weight: 700

    # Emoji glyphs have no meaningful weight variants — a single Regular
    # cut (was 5 weights / 4.3MB, now 861KB) renders identically.
    - family: NotoEmoji
      fonts:
        - asset: assets/fonts/NotoEmoji-Regular.ttf
